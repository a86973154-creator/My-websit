
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وب‌سایت من</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #263b63);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 450px;
      margin: 40px auto;
      padding: 30px 20px;
      background: #ffffff15;
      border-radius: 20px;
    }
    h1 { color: #ffd166; }
    p { line-height: 2; }
    button {
      background: #ffd166;
      color: #172033;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>به وب‌سایت من خوش آمدید!</h1>
    <p>این اولین وب‌سایت من است.</p>
    <button onclick="alert('سلام! به سایت من خوش آمدید.')">
      شروع کنیم
    </button>
  </div>
</body>
</html>
